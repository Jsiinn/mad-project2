name: beast_mode
description: Beast Mode - Social Fitness Tracker
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.19
  cloud_functions: ^4.6.0

  # UI & Navigation
  go_router: ^13.2.0
  cupertino_icons: ^1.0.6

  # State Management
  provider: ^6.1.2

  # Image Handling
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1

  # Charts
  fl_chart: ^0.67.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  fake_cloud_firestore: ^2.4.9
  firebase_auth_mocks: ^0.13.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
